name: Protect commit email history

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/privacy-cleanup.yml
      - .github/scripts/privacy_cleanup.py
  workflow_dispatch:
    inputs:
      phase:
        description: Cleanup phase
        type: choice
        options: [rewrite, purge]
        default: rewrite
      run_ids:
        description: Earlier workflow run IDs to remove after rewriting
        type: string
        default: '[]'

permissions:
  contents: write
  actions: write

jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Protect commit identities
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_PHASE: ${{ inputs.phase || 'rewrite' }}
          OLD_RUN_IDS: ${{ inputs.run_ids || '[]' }}
        run: python .github/scripts/privacy_cleanup.py
